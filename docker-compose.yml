services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: diwaniya
      MYSQL_USER: diwaniya_app
      MYSQL_PASSWORD: change-this-db-password
      MYSQL_ROOT_PASSWORD: change-this-root-password
    volumes:
      - db_data:/var/lib/mysql
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://diwaniya_app:change-this-db-password@db:3306/diwaniya
      JWT_SECRET: change-this-to-a-long-random-secret
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
volumes:
  db_data:
  uploads_data:
